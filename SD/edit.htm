    <style type="text/css" media="screen">
      .contextMenu {
        z-index: 300;
        position: absolute;
        left: 5px;
        border: 1px solid var(--bs-border-color);
        border-radius: var(--bs-border-radius);
        background-color: var(--bs-body-bg);
        display: none;
        box-shadow: 0 0 10px rgba( 0, 0, 0, .4 );
        font-size: .85rem;
      }
      .contextMenu ul {
        list-style: none;
        top: 0;
        left: 0;
        margin: 0;
        padding: 0;
      }
      .contextMenu li {
        position: relative;
        min-width: 60px;
        cursor: pointer;
      }
      .contextMenu span {
        color: var(--bs-body-color);
        display: inline-block;
        padding: 6px;
      }
      .contextMenu li:hover { background: var(--bs-secondary-bg); }
    
      .css-treeview ul, .css-treeview li {
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .css-treeview input {
        position: absolute;
        opacity: 0;
      }

      .css-treeview {
        font-size: .85rem;
        -moz-user-select: none;
        -webkit-user-select: none;
        user-select: none;
      }

      .css-treeview span {
        color: var(--bs-link-color);
        cursor: pointer;
      }

      .css-treeview span:hover {
        text-decoration: underline;
      }

      .css-treeview input + label + ul {
        margin: 0 0 0 22px;
      }

      .css-treeview input ~ ul {
        display: none;
      }

      .css-treeview label, .css-treeview label::before {
        cursor: pointer;
      }

      .css-treeview input:disabled + label {
        cursor: default;
        opacity: .6;
      }

      .css-treeview input:checked:not(:disabled) ~ ul {
        display: block;
      }

      /* Menu bar, toolbar, then the file tree beside the editor (above it on a phone). */
      html, body { height: 100%; }
      body { display: flex; flex-direction: column; }
      #iotanav { margin-bottom: 0; }
      #uploader {
        display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
        padding: .5rem .75rem;
        background: var(--bs-tertiary-bg);
        border-bottom: var(--bs-border-width) solid var(--bs-border-color);
      }
      #uploader input[type=file] { max-width: 16rem; }
      #upload-path { width: 16rem; }
      .drop-here { outline: 2px dashed var(--bs-primary); outline-offset: -2px; }
      .css-treeview .size { color: var(--bs-secondary-color); font-size: .8em; margin-left: .4em; }
      .css-treeview label.current { font-weight: 700; }
      #workarea { flex: 1; display: flex; min-height: 0; }
      #side { width: 220px; flex-shrink: 0; overflow: auto; padding: .5rem;
              border-right: var(--bs-border-width) solid var(--bs-border-color); }
      #editor, #preview { flex: 1; position: relative; min-width: 0; }
      #preview { background-color: var(--bs-tertiary-bg); padding: 5px; overflow: auto; }
      #msgarea { margin: 1rem 0 0; font-size: .85rem; color: var(--bs-secondary-color); }
      @media (max-width: 767.98px) {
        #workarea { flex-direction: column; }
        #side { width: auto; max-height: 30vh; border-right: 0; border-bottom: var(--bs-border-width) solid var(--bs-border-color); }
        #editor, #preview { min-height: 60vh; }
      }

    <script>
      // ---- Upload, new file, new folder (the toolbar) ----
      // Uploads go into the current folder (the one last opened in the tree, "/" at first) under the chosen
      // file's own name, which the path box shows and may change. A file can also be dropped on the
      // toolbar or on a folder. Existing files are replaced only after asking; the IoTaWatt's own files
      // are refused with a pointer to the right tool. Progress and results show in the message area.
      var currentFolder = "/";
      function setCurrentFolder(folder){
        currentFolder = folder || "/";
        var where = document.getElementById("upload-where");
        if(where) where.textContent = "Upload into " + (currentFolder == "/" ? "/" : currentFolder + "/");
        var path = document.getElementById("upload-path");
        var input = document.getElementById("upload-file");
        if(path && input && input.files.length) path.value = joinPath(currentFolder, input.files[0].name);
      }
      function joinPath(folder, name){ return (folder == "/" ? "" : folder) + "/" + name.toLowerCase(); }
      function showMessage(text, kind){
        var m = document.getElementById("msgarea");
        m.textContent = text;
        m.className = kind == "error" ? "text-danger" : (kind == "ok" ? "text-success" : "");
      }
      function protectedPath(p){
        p = p.toLowerCase();
        if(p == "/config.txt" || p == "/config+1.txt") return "The configuration is changed in Setup, or restored in Tools → Backup and restore.";
        if(p.indexOf("/iotawatt/") == 0) return "The IoTaWatt's own files (logs, passwords) can't be replaced from here.";
        return null;
      }

      function createFileUploader(element, tree, editor){
        var bar = document.getElementById(element);
        var where = document.createElement("span");
        where.id = "upload-where";
        where.className = "text-secondary";
        bar.appendChild(where);
        var input = document.createElement("input");
        input.type = "file";
        input.id = "upload-file";
        input.className = "form-control form-control-sm";
        bar.appendChild(input);
        var path = document.createElement("input");
        path.id = "upload-path";
        path.type = "text";
        path.value = "";
        path.placeholder = "path on the SD card";
        path.className = "form-control form-control-sm";
        path.setAttribute("aria-label", "Path");
        bar.appendChild(path);
        var button = document.createElement("button");
        button.textContent = "Upload";
        button.className = "btn btn-sm btn-primary";
        bar.appendChild(button);
        var progress = document.createElement("progress");
        progress.max = 100; progress.style.display = "none";
        bar.appendChild(progress);
        var mkdir = document.createElement("button");
        mkdir.textContent = "New folder";
        mkdir.className = "btn btn-sm btn-outline-secondary";
        bar.appendChild(mkdir);
        var mkfile = document.createElement("button");
        mkfile.textContent = "New file";
        mkfile.className = "btn btn-sm btn-outline-secondary";
        bar.appendChild(mkfile);
        setCurrentFolder("/");

        function createPath(p, done){
          var x = new XMLHttpRequest();
          x.onreadystatechange = function(){
            if(x.readyState != 4) return;
            if(x.status != 200) showMessage("Not created: " + p + " (" + (x.responseText || x.status) + ")", "error");
            else { showMessage("Created " + p, "ok"); tree.refreshPath(p); if(done) done(); }
          };
          var formData = new FormData();
          formData.append("path", p);
          x.open("PUT", "/edit");
          x.send(formData);
        }
        mkfile.onclick = function(){
          var name = prompt("New file in " + (currentFolder == "/" ? "/" : currentFolder + "/") + " (with an extension, e.g. notes.txt):");
          if(!name) return;
          if(name.indexOf(".") === -1){ showMessage("A file name needs an extension.", "error"); return; }
          var p = joinPath(currentFolder, name);
          createPath(p, function(){ editor.loadUrl(p); });
        };
        mkdir.onclick = function(){
          var name = prompt("New folder in " + (currentFolder == "/" ? "/" : currentFolder + "/") + ":");
          if(!name) return;
          createPath(joinPath(currentFolder, name.replace(/\./g, "")));
        };

        // Does the folder already have that name? (asks the device, the tree may not be expanded)
        function exists(p, cb){
          var folder = p.substring(0, p.lastIndexOf("/")) || "/";
          var name = p.substring(p.lastIndexOf("/") + 1);
          var x = new XMLHttpRequest();
          x.onreadystatechange = function(){
            if(x.readyState != 4) return;
            var found = false;
            try { JSON.parse(x.responseText).forEach(function(i){ if(i.name.toLowerCase() == name) found = i; }); } catch(e) {}
            cb(found);
          };
          x.open("GET", "/list?dir=" + encodeURIComponent(folder), true);
          x.send(null);
        }

        function upload(file){
          var p = path.value.trim().toLowerCase() || joinPath(currentFolder, file.name);
          if(p.charAt(0) != "/") p = "/" + p;
          var refuse = protectedPath(p);
          if(refuse){ showMessage(p + ": " + refuse, "error"); return; }
          exists(p, function(found){
            if(found && !confirm(p + " already exists (" + found.size + " bytes). Replace it?")) return;
            var x = new XMLHttpRequest();
            x.upload.onprogress = function(e){
              if(!e.lengthComputable) return;
              progress.value = 100 * e.loaded / e.total;
              showMessage("Uploading " + p + ": " + Math.round(100 * e.loaded / e.total) + " %");
            };
            x.onreadystatechange = function(){
              if(x.readyState != 4) return;
              progress.style.display = "none";
              button.disabled = false;
              if(x.status != 200) showMessage("Not uploaded: " + p + " (" + (x.responseText || ("error " + x.status)) + ")", "error");
              else { showMessage("Uploaded " + p + " (" + file.size + " bytes)", "ok"); tree.refreshPath(p); }
            };
            var formData = new FormData();
            formData.append("data", file, p);
            progress.value = 0; progress.style.display = "inline";
            button.disabled = true;
            x.open("POST", "/edit");
            x.send(formData);
          });
        }
        button.onclick = function(){
          if(input.files.length === 0){ showMessage("Choose a file (or drop one here) first."); return; }
          upload(input.files[0]);
        };
        input.onchange = function(){
          if(input.files.length) path.value = joinPath(currentFolder, input.files[0].name);
        };

        // Drop a file on the toolbar (into the current folder) or on a folder in the tree (into that folder).
        function dropTarget(el, folderOf){
          el.addEventListener("dragover", function(e){ e.preventDefault(); el.classList.add("drop-here"); });
          el.addEventListener("dragleave", function(){ el.classList.remove("drop-here"); });
          el.addEventListener("drop", function(e){
            e.preventDefault(); e.stopPropagation(); el.classList.remove("drop-here");
            if(!e.dataTransfer.files.length) return;
            var folder = folderOf(e);
            if(folder) setCurrentFolder(folder);
            path.value = joinPath(currentFolder, e.dataTransfer.files[0].name);
            upload(e.dataTransfer.files[0]);
          });
        }
        dropTarget(bar, function(){ return null; });
        dropTarget(document.getElementById("tree"), function(e){
          var li = e.target.closest ? e.target.closest("li") : null;
          var check = li && li.querySelector("input[type=checkbox]");
          return check ? check.id : "/";
        });
      }

      function createTree(element, editor){
        var preview = document.getElementById("preview");
        var treeRoot = document.createElement("div");
        treeRoot.className = "css-treeview";
        document.getElementById(element).appendChild(treeRoot);
  
        function loadDownload(path){
          document.getElementById('download-frame').src = path+"?download=true";
        }
  
        function loadPreview(path){
          document.getElementById("editor").style.display = "none";
          preview.style.display = "block";
          preview.innerHTML = '<img src="'+path+'" style="max-width:100%; max-height:100%; margin:auto; display:block;" />';
        }
  
        // One context menu entry: runs action, then closes the menu.
        function menuItem(list, el, label, action){
          var item = document.createElement("li");
          list.appendChild(item);
          item.innerHTML = "<span>" + label + "</span>";
          item.onclick = function(e){
            action();
            if(document.body.getElementsByClassName('contextMenu').length > 0) document.body.removeChild(el);
          };
        }

        // Reload a folder's listing in the tree.
        function reloadFolder(path){
          var leaf = document.getElementById(path).parentNode;
          if(leaf.childNodes.length == 3) leaf.removeChild(leaf.childNodes[2]);
          httpGet(leaf, path);
        }

        function fillFolderMenu(el, path){
          var list = document.createElement("ul");
          el.appendChild(list);
          if(document.getElementById(path).checked){
            menuItem(list, el, "Collapse", function(){ document.getElementById(path).checked = false; });
            menuItem(list, el, "Refresh", function(){ reloadFolder(path); });
          } else {
            menuItem(list, el, "Expand", function(){
              document.getElementById(path).checked = true;
              reloadFolder(path);
            });
          }
          menuItem(list, el, "Upload here", function(){ markCurrent(path); });
          menuItem(list, el, "Delete", function(){ confirmDelete(path, true); });
        }

        function fillFileMenu(el, path){
          var list = document.createElement("ul");
          el.appendChild(list);
          if(isTextFile(path)){
            menuItem(list, el, "Edit", function(){ editor.loadUrl(path); });
          } else if(isImageFile(path)){
            menuItem(list, el, "Preview", function(){ loadPreview(path); });
          }
          menuItem(list, el, "Download", function(){ loadDownload(path); });
          menuItem(list, el, "Delete", function(){ confirmDelete(path, false); });
        }

        function showContextMenu(e, path, isfile){
          var divContext = document.createElement("div");
          var scrollTop = document.body.scrollTop ? document.body.scrollTop : document.documentElement.scrollTop;
          var scrollLeft = document.body.scrollLeft ? document.body.scrollLeft : document.documentElement.scrollLeft;
          var left = e.clientX + scrollLeft;
          var top = e.clientY + scrollTop;
          divContext.className = 'contextMenu';
          divContext.style.display = 'block';
          divContext.style.left = left + 'px';
          divContext.style.top = top + 'px';
          if(isfile) fillFileMenu(divContext, path);
          else fillFolderMenu(divContext, path);
          document.body.appendChild(divContext);
          var width = divContext.offsetWidth;
          var height = divContext.offsetHeight;
          divContext.onmouseout = function(e){
            if(e.clientX < left || e.clientX > (left + width) || e.clientY < top || e.clientY > (top + height)){
              if(document.body.getElementsByClassName('contextMenu').length > 0) document.body.removeChild(divContext);
            }
          };
        }
  
        function createTreeLeaf(path, name, size){
          var leaf = document.createElement("li");
          leaf.id = (((path == "/")?"":path)+"/"+name).toLowerCase();
          var label = document.createElement("span");
          label.textContent = name.toLowerCase();
          leaf.appendChild(label);
          if(size !== undefined){
            var sz = document.createElement("span");
            sz.className = "size";
            sz.textContent = size < 1024 ? size + " B" : size < 1048576 ? Math.round(size / 1024) + " KB" : (size / 1048576).toFixed(1) + " MB";
            leaf.appendChild(sz);
          }
          leaf.onclick = function(e){
            if(isTextFile(leaf.id)){
              editor.loadUrl(leaf.id);
            } else if(isImageFile(leaf.id)){
              loadPreview(leaf.id);
            }
          };
          leaf.oncontextmenu = function(e){
            e.preventDefault();
            e.stopPropagation();
            showContextMenu(e, leaf.id, true);
          };
          return leaf;
        }
  
        function createTreeBranch(path, name, disabled){
          var leaf = document.createElement("li");
          var check = document.createElement("input");
          check.type = "checkbox";
          check.id = (((path == "/")?"":path)+"/"+name).toLowerCase();
          if(typeof disabled !== "undefined" && disabled) check.disabled = "disabled";
          leaf.appendChild(check);
          var label = document.createElement("label");
          label.for = check.id;
          label.textContent = name.toLowerCase();
          leaf.appendChild(label);
          check.onchange = function(e){
            if(check.checked){
              if(leaf.childNodes.length == 3) leaf.removeChild(leaf.childNodes[2]);
              httpGet(leaf, check.id);
            }
          };
          label.onclick = function(e){
            markCurrent(check.id);
            if(!check.checked){
              check.checked = true;
              if(leaf.childNodes.length == 3) leaf.removeChild(leaf.childNodes[2]);
              httpGet(leaf, check.id);
            } else {
              check.checked = false;
            }
          };
          leaf.oncontextmenu = function(e){
            e.preventDefault();
            e.stopPropagation();
            showContextMenu(e, check.id, false);
          }
          return leaf;
        }
  
        function addList(parent, path, items){
          var list = document.createElement("ul");
          parent.appendChild(list);
          var ll = items.length;
          for(var i = 0; i < ll; i++){
            var item = items[i];
            var itemEl;
            if(item.type === "file"){
              itemEl = createTreeLeaf(path, item.name, item.size);
            } else {
              itemEl = createTreeBranch(path, item.name);
            }
            list.appendChild(itemEl);
          }
    
        }
  
        function isTextFile(path){
          var ext = /(?:\.([^.]+))?$/.exec(path)[1];
          if(typeof ext !== undefined){
            switch(ext){
              case "txt":
              case "htm":
              case "html":
              case "js":
              case "json":
              case "c":
              case "h":
              case "cpp":
              case "css":
              case "xml":
                return true;
            }
          }
          return false;
        }
  
        function isImageFile(path){
          var ext = /(?:\.([^.]+))?$/.exec(path)[1];
          if(typeof ext !== undefined){
            switch(ext){
              case "png":
              case "jpg":
              case "gif":
              case "ico":
                return true;
            }
          }
          return false;
        }
  
        this.refreshPath = function(path){
          if(path.lastIndexOf('/') < 1){
            path = '/';
            treeRoot.removeChild(treeRoot.childNodes[0]);
            httpGet(treeRoot, "/");
          } else {
            path = path.substring(0, path.lastIndexOf('/'));
            var leaf = document.getElementById(path).parentNode;
            if(leaf.childNodes.length == 3) leaf.removeChild(leaf.childNodes[2]);
            httpGet(leaf, path);
          }
        };
  
        function delCb(path){
          return function(){
            if (xmlHttp.readyState == 4){
              if(xmlHttp.status != 200){
                showMessage("Not deleted: " + path + " (" + (xmlHttp.responseText || xmlHttp.status) + ")", "error");
              } else {
                showMessage("Deleted " + path, "ok");
                if(path.lastIndexOf('/') < 1){
                  path = '/';
                  treeRoot.removeChild(treeRoot.childNodes[0]);
                  httpGet(treeRoot, "/");
                } else {
                  path = path.substring(0, path.lastIndexOf('/'));
                  var leaf = document.getElementById(path).parentNode;
                  if(leaf.childNodes.length == 3) leaf.removeChild(leaf.childNodes[2]);
                  httpGet(leaf, path);
                }
              }
            }
          }
        }
  
        // The folder uploads go into: bold in the tree, named in the toolbar.
        function markCurrent(folder){
          var old = treeRoot.querySelector("label.current");
          if(old) old.classList.remove("current");
          var check = document.getElementById(folder);
          if(check && check.nextSibling) check.nextSibling.classList.add("current");
          setCurrentFolder(folder);
        }

        function confirmDelete(p, isFolder){
          var refuse = protectedPath(p) || (p == "/iotawatt" ? "The IoTaWatt's own folder can't be deleted." : null);
          if(refuse){ showMessage(p + ": " + refuse, "error"); return; }
          if(!confirm("Delete " + p + (isFolder ? " and everything in it" : "") + "?")) return;
          httpDelete(p);
        }

        function httpDelete(filename){
          xmlHttp = new XMLHttpRequest();
          xmlHttp.onreadystatechange = delCb(filename);
          var formData = new FormData();
          formData.append("path", filename);
          xmlHttp.open("DELETE", "/edit");
          xmlHttp.send(formData);
        }
  
        function getCb(parent, path){
          return function(){
            if (xmlHttp.readyState == 4){
              //clear loading
              if(xmlHttp.status == 200) addList(parent, path, JSON.parse(xmlHttp.responseText));
            }
          }
        }
  
        function httpGet(parent, path){
          xmlHttp = new XMLHttpRequest(parent, path);
          xmlHttp.onreadystatechange = getCb(parent, path);
          xmlHttp.open("GET", "/list?dir="+path, true);
          xmlHttp.send(null);
          //start loading
        }
  
        httpGet(treeRoot, "/");
        return this;
      }

      function createEditor(element, file, lang, theme, type){
        function getLangFromFilename(filename){
          var lang = "plain";
          var ext = /(?:\.([^.]+))?$/.exec(filename)[1];
          if(typeof ext !== undefined){
            switch(ext){
              case "txt": lang = "plain"; break;
              case "htm": lang = "html"; break;
              case "js": lang = "javascript"; break;
              case "c": lang = "c_cpp"; break;
              case "cpp": lang = "c_cpp"; break;
              case "css":
              case "scss":
              case "php":
              case "html":
              case "json":
              case "xml":
                lang = ext;
            }
          }
          return lang;
        }
  
        if(typeof file === "undefined") file = "/index.htm";
  
        if(typeof lang === "undefined"){
          lang = getLangFromFilename(file);
        }
  
        if(typeof theme === "undefined"){
          theme = document.documentElement.getAttribute("data-bs-theme") == "dark" ? "tomorrow_night" : "textmate";
        }
  
        if(typeof type === "undefined"){
          type = "text/"+lang;
          if(lang === "c_cpp") type = "text/plain";
        }
  
        var xmlHttp = null;
        var editor = ace.edit(element);
  
        //post
        function httpPostProcessRequest(){
          if (xmlHttp.readyState == 4){
            if(xmlHttp.status != 200) alert("ERROR["+xmlHttp.status+"]: "+xmlHttp.responseText);
          }
        }
        function httpPost(filename, data, type){
          xmlHttp = new XMLHttpRequest();
          xmlHttp.onreadystatechange = httpPostProcessRequest;
          var formData = new FormData();
          formData.append("data", new Blob([data], { type: type }), filename);
          xmlHttp.open("POST", "/edit");
          xmlHttp.send(formData);
        }
        //get
        function httpGetProcessRequest(){
          if (xmlHttp.readyState == 4){
            document.getElementById("preview").style.display = "none";
            document.getElementById("editor").style.display = "block";
            if(xmlHttp.status == 200) editor.setValue(xmlHttp.responseText);
            else editor.setValue("");
            editor.clearSelection();
          }
        }
        function httpGet(theUrl){
            xmlHttp = new XMLHttpRequest();
            xmlHttp.onreadystatechange = httpGetProcessRequest;
            xmlHttp.open("GET", theUrl, true);
            xmlHttp.send(null);
        }
  
        if(lang !== "plain") editor.getSession().setMode("ace/mode/"+lang);
        editor.setTheme("ace/theme/"+theme);
        editor.$blockScrolling = Infinity;
        editor.getSession().setUseSoftTabs(true);
        editor.getSession().setTabSize(2);
        editor.setHighlightActiveLine(true);
        editor.setShowPrintMargin(false);
        editor.commands.addCommand({
            name: 'saveCommand',
            bindKey: {win: 'Ctrl-S',  mac: 'Command-S'},
            exec: function(editor) {
              httpPost(file, editor.getValue()+"", type);
            },
            readOnly: false
        });
        editor.commands.addCommand({
            name: 'undoCommand',
            bindKey: {win: 'Ctrl-Z',  mac: 'Command-Z'},
            exec: function(editor) {
              editor.getSession().getUndoManager().undo(false);
            },
            readOnly: false
        });
        editor.commands.addCommand({
            name: 'redoCommand',
            bindKey: {win: 'Ctrl-Shift-Z',  mac: 'Command-Shift-Z'},
            exec: function(editor) {
              editor.getSession().getUndoManager().redo(false);
            },
            readOnly: false
        });
        httpGet(file);
        editor.loadUrl = function(filename){
          file = filename;
          lang = getLangFromFilename(file);
          type = "text/"+lang;
          if(lang !== "plain") editor.getSession().setMode("ace/mode/"+lang);
          httpGet(file);
        }
        return editor;
      }
      function onBodyLoad(){
        var vars = {};
        var parts = window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/gi, function(m,key,value) { vars[key] = value; });
        var editor = createEditor("editor", vars.file, vars.lang, vars.theme);
        var tree = createTree("tree", editor);
        createFileUploader("uploader", tree, editor);
      };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.1.9/ace.js" type="text/javascript" charset="utf-8"></script>
  </head>
  <body onload="onBodyLoad();">
    <nav id="iotanav"></nav>
    <div id="uploader"></div>
    <div id="workarea">
      <div id="side">
        <div id="tree"></div>
        <div id="msgarea">Open a folder to upload into it, or drop a file on it.</div>
      </div>
      <div id="editor"></div>
      <div id="preview" style="display:none;"></div>
    </div>
    <iframe id=download-frame style='display:none;'></iframe>
  </body>
</html>
