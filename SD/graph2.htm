<!doctype html>
<html lang="en">
<head>
    <!--

    This application was originally based on a similar graph application available in the open source Emoncms system.
    It was forked in 2017 and modified to use the IoTaWatt API, which is significantly different from the datasource of
    the Emoncms system. Since that time, the Emoncms version was extensively modified.
    In September of 2019, the HTML and JS of this fork was extensively rewritten and an estimated 90% of the original code
    was replaced and some of the basic paradigms were altered to unlock all of the data available from IoTaWatt and to
    provide for more robust time specification in the queries.

    Thanks to the folks at Open Energy Monitor for the initial design, and whatever copyright applied to that original
    program is included here by reference.

    -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Graph+</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="cnfstyle.css">
    <script src="bootstrap.min.js"></script>
    <script src="iotanav.js"></script>
    <!-- Charts: uPlot (MIT), served by the device like the rest of the page: nothing from the internet -->
    <link rel="stylesheet" href="uplot.min.css">
    <script src="uplot.min.js"></script>
</head>

<body onload=initialize()>
    <nav id="iotanav" class="embed"></nav>

    <div id="wrapper" class="container-fluid graph-page">
        <div class="row g-3">

            <!-- ------------------------------------------------------------------------------------------
                        Sidebar - units, sources and saved graphs: a column on wide screens, a slide-out
                        panel (the Sources button) on narrow ones
            ---------------------------------------------------------------------------------------------->
            <aside id="sidebar-wrapper" class="col-lg-3 offcanvas-lg offcanvas-start embed" tabindex="-1" aria-labelledby="sidebar-title">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="sidebar-title">Sources</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar-wrapper" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body flex-column">
                    <h6 class="graph-side-heading">Units</h6>
                    <div id="units-select" class="d-flex flex-wrap gap-1 mb-3"></div>

                    <h6 class="graph-side-heading">Source</h6>
                    <div id="source-table" class="mb-3"></div>

                    <label for="graph-select" class="form-label">Saved graphs</label>
                    <select id="graph-select" class="form-select form-select-sm mb-2"></select>
                    <label for="graph-name" class="form-label">Graph name</label>
                    <input id="graph-name" type="text" class="form-control form-control-sm mb-2">
                    <div class="d-flex gap-2 mb-3">
                        <button id="graph-delete" class="btn btn-sm btn-outline-danger" style="display:none">Delete</button>
                        <button id="graph-save" class="btn btn-sm btn-primary">Save</button>
                        <button id="graph-reset" class="btn btn-sm btn-outline-secondary">Reset</button>
                    </div>
                </div>
            </aside>

            <!-- ------------------------------------------------------------------------------------------
                        Main content
            ---------------------------------------------------------------------------------------------->
            <main id="body-wrapper" class="col-lg">

                <div id="header-wrapper" class="embed">
                    <h1 id="title" class="graph-title">Graph+</h1>
                    <div id="error" class="alert alert-danger py-2" style="display:none"></div>
                </div>

                <!-- Period, group, start and end, zoom/pan -->
                <div id="period-wrapper" class="embed">
                    <div class="d-flex flex-wrap gap-2 mb-2">
                        <button id="sidebar-open" class="btn btn-outline-secondary d-lg-none" type="button"
                                data-bs-toggle="offcanvas" data-bs-target="#sidebar-wrapper" aria-controls="sidebar-wrapper">
                            <i class="ico ico-layout-sidebar"></i> Sources
                        </button>
                        <select id="select-period" class="form-select w-auto" name="options" aria-label="Period"></select>
                        <div class="input-group w-auto">
                            <label for="select-group" class="input-group-text">Group</label>
                            <select id="select-group" class="form-select select-group"></select>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mb-2">
                        <div class="input-group w-auto">
                            <label for="request-start" class="input-group-text graph-date-label">Start</label>
                            <input type="datetime-local" class="form-control" id="request-start">
                        </div>
                        <div class="input-group w-auto">
                            <label for="request-end" class="input-group-text graph-date-label">End</label>
                            <input type="datetime-local" class="form-control" id="request-end">
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mb-2">
                        <div class="btn-group" role="group" aria-label="Zoom and move">
                            <button class="btn btn-outline-secondary zoom" value=.5 title="Zoom in"><i class="ico ico-zoom-in"></i></button>
                            <button class="btn btn-outline-secondary zoom" value=2 title="Zoom out"><i class="ico ico-zoom-out"></i></button>
                            <button class="btn btn-outline-secondary pan" value=-1 title="Back full-frame"><i class="ico ico-chevron-double-left"></i></button>
                            <button class="btn btn-outline-secondary pan" value=-0.5 title="Back half-frame"><i class="ico ico-chevron-left"></i></button>
                            <button class="btn btn-outline-secondary pan" value=+0.5 title="Forward half-frame"><i class="ico ico-chevron-right"></i></button>
                            <button class="btn btn-outline-secondary pan" value=+1 title="Forward full-frame"><i class="ico ico-chevron-double-right"></i></button>
                        </div>
                        <button id="refresh" class="btn btn-outline-secondary" title="Refresh">
                            <i class="ico ico-arrow-clockwise"></i><span id="refresh-text"> Refresh</span>
                        </button>
                        <button id="show-legend" class="btn btn-outline-secondary ms-auto">Hide Legend</button>
                    </div>
                </div>

                <!-- Graph -->
                <div id="placeholder_bound" class="graph-bound">
                    <div id="placeholder"></div>
                </div>

                <!-- Tables: y axes, options, statistics, CSV data -->
                <div id="tables-wrapper" class="embed">
                    <div id="graph-tables" class="card data-tables mt-3">
                        <div class="card-header table-top">
                            <div class="btn-group btn-group-sm flex-wrap" role="group" aria-label="Tables">
                                <button id="showYaxis" class="btn btn-outline-secondary show-tables" value="yaxes">Y axes</button>
                                <button id="showSourceOptions" class="btn btn-outline-secondary show-tables" value="options">Options</button>
                                <button id="showSourceStats" class="btn btn-outline-secondary show-tables" value="stats">Statistics</button>
                                <button id="showCSV" class="btn btn-outline-secondary show-tables" value="CSV">CSV data</button>
                            </div>
                        </div>
                        <div class="card-body p-0 graph-table-scroll">

                            <table id="yaxesTable" class="table table-sm data-table mb-0">
                                <thead>
                                    <tr class="table-header">
                                        <th style="text-align:left">Unit</th>
                                        <th>Plot Range</th>
                                        <th>Data Range</th>
                                        <th>Min</th>
                                        <th></th>
                                        <th>Max</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="yaxesBody"></tbody>
                            </table>

                            <table id="sourceOptionsTable" class="table table-sm data-table mb-0">
                                <thead>
                                    <tr class="table-header">
                                        <th></th>
                                        <th></th>
                                        <th style="text-align:left">Source</th>
                                        <th>Color</th>
                                        <th>Line/Bar</th>
                                        <th>Fill</th>
                                        <th>Stack</th>
                                        <th>Accrue</th>
                                        <th>Decimals</th>
                                        <th>Scale</th>
                                    </tr>
                                </thead>
                                <tbody id="sourceOptionsBody"></tbody>
                            </table>

                            <table id="sourceStatsTable" class="table table-sm data-table mb-0">
                                <thead>
                                    <tr class="table-header">
                                        <th></th>
                                        <th></th>
                                        <th style="text-align:left">Source</th>
                                        <th>Quality</th>
                                        <th>Min</th>
                                        <th>Max</th>
                                        <th>Diff</th>
                                        <th>Average</th>
                                        <th>Sum/Integral</th>
                                    </tr>
                                </thead>
                                <tbody id="sourceStatsBody"></tbody>
                            </table>

                            <div id="CSVgroup" class="data-table p-2">
                                <div id="csvheader" class="d-flex flex-wrap gap-2 align-items-center mb-2">
                                    <div class="input-group input-group-sm w-auto">
                                        <label for="csvtimeformat" class="input-group-text">Time format</label>
                                        <select id="csvtimeformat" class="form-select">
                                            <option value="datestr" selected>Date-time string</option>
                                            <option value="seconds">Seconds from start</option>
                                            <option value="unix">Unix time</option>
                                        </select>
                                    </div>
                                    <div class="input-group input-group-sm w-auto">
                                        <label for="csvnullvalues" class="input-group-text">Null values</label>
                                        <select id="csvnullvalues" class="form-select">
                                            <option value="show" selected>Show</option>
                                            <option value="remove">Remove line</option>
                                        </select>
                                    </div>
                                    <button id="copycsv" class="btn btn-sm btn-outline-secondary" title="Copy to clipboard"><i class="ico ico-copy"></i> Copy</button>
                                    <button id="downloadcsv" class="btn btn-sm btn-outline-secondary" title="Download CSV file"><i class="ico ico-download"></i> Download</button>
                                </div>
                                <textarea readonly id="csv" class="form-control font-monospace" rows=20></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <footer id="copyright" class="embed"><small>&#xA9; 2020 IoTaWatt, Inc.</small></footer>
    </div>

    <script src="graph2.js"></script>
</body>
</html>
