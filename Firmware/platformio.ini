; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = IotaWatt
default_envs = iotawatt
; Optional, untracked local overrides (e.g. a dev version string or signing key); ignored if absent.
extra_configs = platformio_local*.ini

[common]
lib_deps = bblanchon/ArduinoJson@7.4.3
	WifiManager@0.16
	https://github.com/OperatorFoundation/Crypto@^0.4.0
	ESPAsyncTCP@1.2.2
	https://github.com/boblemaire/asyncHTTPrequest@1.2.2

[env:iotawatt]
platform = espressif8266@2.4.0
build_unflags = -Wall
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
	-D ARDUINOJSON_ENABLE_COMMENTS=1
board = esp12e
framework = arduino
lib_deps = ${common.lib_deps}
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

upload_port = COM28

[env:latest_master]
platform = espressif8266
board = nodemcuv2
framework = arduino
platform_packages = 
	platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git
	mcspr/toolchain-xtensa @ 5.100200.201223
lib_deps = ${common.lib_deps}
build_unflags = -Wall
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
	-D CORE_3_0
upload_speed = 921600
monitor_speed = 115200
upload_port = COM3

; Host unit tests: `pio test -e native` (see test/README.md). Device sources are included by the
; tests themselves; test/shim stands in for the Arduino headers they need.
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_compat_mode = off
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags = -std=gnu++17 -g -Wall
	-I IotaWatt -I test/shim
	-D ARDUINOJSON_ENABLE_COMMENTS=1
	-D IOTAWATT_HOST_TEST
	-D UNITY_INCLUDE_DOUBLE
	-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer
build_unflags =
extra_scripts = post:scripts/native_sanitize.py

; Current stable toolchain: platform 4.2.1 = Arduino ESP8266 core 3.1.2 (pinned).
[env:core3]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
; Pinned exact versions so builds are reproducible.
lib_deps = bblanchon/ArduinoJson@7.4.3
	tzapu/WiFiManager@2.0.17
	https://github.com/OperatorFoundation/Crypto#0.4.0
	me-no-dev/ESPAsyncTCP@2.0.0
	https://github.com/boblemaire/asyncHTTPrequest#d47d6034a5a4112accaa60d1f74788646991a958
build_unflags = -Wall
; lwIP without router features (IP forwarding/NAPT); same 1460-byte MSS as HIGHER_BANDWIDTH.
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH
	-D CORE_3_0
	-D ARDUINOJSON_ENABLE_COMMENTS=1    ; v5 accepted /* */ and // in config.txt
extra_scripts = post:scripts/no_scanf_float.py
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
