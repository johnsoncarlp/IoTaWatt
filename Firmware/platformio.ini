; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = IotaWatt
default_envs = iotawatt
; Optional, untracked local overrides (e.g. a dev version string or signing key); ignored if absent.
extra_configs = platformio_local*.ini

[common]
; Exact versions, git dependencies by commit: see dependencies.lock and scripts/lock_check.py.
lib_deps = bblanchon/ArduinoJson@7.4.3
	tzapu/WiFiManager@0.16.0
	https://github.com/OperatorFoundation/Crypto#4a6b190f7b1efd96d024d0f4510498963740b001   ; tag 0.4.0
	me-no-dev/ESPAsyncTCP@1.2.2
	https://github.com/boblemaire/asyncHTTPrequest#d47d6034a5a4112accaa60d1f74788646991a958

[env:iotawatt]
platform = espressif8266@2.4.0
platform_packages =                             ; exact (the platform alone allows patch updates)
	platformio/framework-arduinoespressif8266 @ 3.20603.200130
	platformio/toolchain-xtensa @ 2.40802.200502
	platformio/tool-esptoolpy @ 1.20800.0
	platformio/tool-esptool @ 1.413.0
build_unflags = -Wall
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
	-D ARDUINOJSON_ENABLE_COMMENTS=1
board = esp12e
framework = arduino
lib_deps = ${common.lib_deps}
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
extra_scripts = pre:scripts/lock_check.py           ; the dependencies are the locked ones
	post:scripts/size_check.py     ; fail before the device runs out of room (limits below)
custom_max_flash_percent = 85
custom_max_ram_percent = 55

upload_port = COM28

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_compat_mode = off
lib_deps = bblanchon/ArduinoJson@7.4.3
	https://github.com/OperatorFoundation/Crypto#4a6b190f7b1efd96d024d0f4510498963740b001   ; tag 0.4.0
build_flags = -std=gnu++17 -g -Wall
	-Uunix -Ulinux                      ; GCC predefines these on Linux; the firmware uses unix as an enum name
	-I IotaWatt -I test/shim
	-D ARDUINOJSON_ENABLE_COMMENTS=1
	-D IOTAWATT_HOST_TEST
	-D UNITY_INCLUDE_DOUBLE
	-lz
	-D ARDUINOJSON_ENABLE_ARDUINO_STRING=1
	-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer
build_unflags =
extra_scripts = pre:scripts/lock_check.py
	pre:scripts/embed_webui.py
	post:scripts/native_sanitize.py

; Current stable toolchain: platform 4.2.1 = Arduino ESP8266 core 3.1.2 (pinned).
[env:core3]
platform = espressif8266@4.2.1
platform_packages =                             ; exact (the platform alone allows patch updates)
	platformio/framework-arduinoespressif8266 @ 3.30102.0
	platformio/toolchain-xtensa @ 2.100300.220621
	platformio/tool-esptoolpy @ 1.30000.201119
	platformio/tool-esptool @ 1.413.0
board = esp12e
framework = arduino
; Pinned exact versions so builds are reproducible.
lib_deps = bblanchon/ArduinoJson@7.4.3
	tzapu/WiFiManager@2.0.17
	https://github.com/OperatorFoundation/Crypto#4a6b190f7b1efd96d024d0f4510498963740b001   ; tag 0.4.0
	me-no-dev/ESPAsyncTCP@2.0.0
	https://github.com/boblemaire/asyncHTTPrequest#d47d6034a5a4112accaa60d1f74788646991a958
build_unflags = -Wall
; lwIP without router features (IP forwarding/NAPT); same 1460-byte MSS as HIGHER_BANDWIDTH.
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH
	-D CORE_3_0
	-D ARDUINOJSON_ENABLE_COMMENTS=1    ; v5 accepted /* */ and // in config.txt
	-Wformat                            ; printf/log() format checking (log() is checkable, see messageLog.h)
custom_lock_env = core3                         ; environments extending this one share its lock entry
extra_scripts = pre:scripts/lock_check.py           ; the dependencies are the locked ones
	pre:scripts/embed_webui.py
	post:scripts/no_scanf_float.py
	post:scripts/size_check.py          ; fail before the device runs out of room (limits below)
custom_max_flash_percent = 85
custom_max_ram_percent = 55
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
